name: Bug report / 错误报告
description: Report a reproducible problem in SpaceLens / 报告可复现的问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SpaceLens. Do not upload private files. Please use a minimal synthetic sample whenever possible.

        感谢你帮助改进 SpaceLens。请勿上传隐私文件，并尽量使用最小合成样例。
  - type: input
    id: macos
    attributes:
      label: macOS version / macOS 版本
      placeholder: e.g. macOS 15.6
    validations:
      required: true
  - type: input
    id: spacelens
    attributes:
      label: SpaceLens version / SpaceLens 版本
      placeholder: e.g. 0.9.1 (24) or commit SHA
    validations:
      required: true
  - type: input
    id: format
    attributes:
      label: File type / 文件类型
      placeholder: e.g. ZIP, Markdown, SQLite
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      description: Explain the smallest reliable sequence that triggers the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际结果
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context / 补充信息
      description: Add screenshots or a minimal synthetic sample if they are safe to share.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation / 隐私确认
      options:
        - label: I have not attached private, confidential, or personal files. / 我没有附加隐私、机密或个人文件。
          required: true
