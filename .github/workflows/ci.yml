name: macOS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app
      - name: Run release checks
        run: ./scripts/release-check.sh
