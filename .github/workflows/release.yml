name: Release DMG
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example v0.9.2)
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  dmg:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - name: Check the tag against the bundle version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#v}"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Config/App-Info.plist)"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Config/App-Info.plist)"
          if [[ "$tag" != "$version" ]]; then
            echo "Tag $RELEASE_TAG does not match CFBundleShortVersionString $version." >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: Tests, metadata, and Release build
        run: ./scripts/release-check.sh
      - name: Build the disk image
        run: ./scripts/package-dmg.sh
      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/release-notes.sh "$VERSION" build/dmg/*.dmg > release-notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" build/dmg/*.dmg \
            --title "SpaceLens $VERSION" \
            --notes-file release-notes.md \
            --verify-tag
